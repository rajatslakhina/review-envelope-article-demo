name: Visuals

on:
  push:
    branches: [main]
    paths: ['docs/src/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render header and diagram at 2x
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node docs/src/render.js
      - name: Commit visuals if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/header.png docs/diagram.png
          if ! git diff --cached --quiet; then
            git commit -m "Render article visuals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
